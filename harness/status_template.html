<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- With JavaScript on, the page reloads every 30 s while Live is on, but never with a card open, never while a
     video plays with sound, and never within 10 s of the viewer's last input. This tag is the same reload without JS. -->
<noscript><meta http-equiv="refresh" content="30"></noscript>
<title>Bot18</title>
<link rel="icon" href="data:,">  <!-- no favicon request, so no 404 in the console -->
<!-- Generated by harness/status.py from playbook/validation.yaml, runs/status/* and playbook/skills/*. Do not edit
     index.html; change this template. Layout, tokens and motion rules: docs/design/ui-protocol.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Source+Sans+3:wght@400;500;600&display=swap">
<!-- Gloock sets only the builders wordmark, so only its letters are fetched -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&text=Bot18%20%C3%97Argon&display=swap">
<style>
/* Tokens lifted from pi.website (blog/api-beta: its CSS variables and its api-workflow SVG). See docs/design/ui-protocol.md. */
:root {
  color-scheme: light;
  --paper: #f5f4ef; --tile: #eeece4; --tan: #e6e0cb; --line: #d7cfb6; --divider: #e5e4dc; --hover: #ebeae5;
  --button: #d9d8d3; --button-hover: #c4c3bb;
  --ink: #29271f; --ink-2: #625c4b; --ink-3: #746d58;
  --arrow: #aaa184; --gold: #fbd45b; --gold-line: #c9a533; --green: #9bbc6c; --green-deep: #577b37;
  --white: #fff; --media: #000;
  --lift: 0 8px 24px -12px rgba(41,39,31,.3);
  --card: 0 32px 80px -24px rgba(41,39,31,.35);
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
  --sans: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --display: "Gloock", "Newsreader", Georgia, serif;  /* the builders wordmark only */
  --top: 64px;     /* room for the logo and the brain switch */
  --bottom: 84px;  /* room for the navigator */
  /* states: --c is the glyph and line colour, --t a tint */
  --pass: #577b37; --pass-t: #e3ebd3;
  --prog: #8f6e0c; --prog-t: #fbefc4;
  --fail: #b35a17; --fail-t: #f6e2cf;
  --regr: #a8372a; --regr-t: #f2d9d3;
  --none: #9a927a;
}
.s-none { --c: var(--none); --t: transparent; }
.s-prog { --c: var(--prog); --t: var(--prog-t); }
.s-pass { --c: var(--pass); --t: var(--pass-t); }
.s-fail { --c: var(--fail); --t: var(--fail-t); }
.s-regr { --c: var(--regr); --t: var(--regr-t); }
.s-track { --c: var(--ink-3); --t: transparent; }

* { box-sizing: border-box; }
html { background: var(--paper); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--mono); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
a:hover { text-decoration-color: currentColor; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
code { font: 12.5px/1.4 var(--mono); }
.gl { color: var(--c); font-weight: 700; font-style: normal; }
.note { color: var(--ink-3); font-size: 12.5px; margin: 6px 0 12px; }
.warn { color: var(--regr); font-size: 12.5px; }

/* ---------------------------------------------------------------- chrome: logo and brain switch, progress, navigator, live and builders */
.topfade { position: fixed; inset: 0 0 auto; height: var(--top); z-index: 28; pointer-events: none;
           background: linear-gradient(var(--paper) 62%, rgba(245,244,239,0)); }
.prog { position: fixed; inset: 0 0 auto; height: 3px; z-index: 31; pointer-events: none; }
.prog i { display: block; height: 100%; background: var(--gold-line); transform-origin: 0 50%; transform: scaleX(0); }
.chrome-l { position: fixed; top: 13px; left: 22px; z-index: 30; display: flex; align-items: center; gap: 18px; }
.logo { font: 500 27px/1 var(--serif); letter-spacing: -.015em; color: var(--ink); text-decoration: none; cursor: pointer; }
.brains { display: inline-flex; gap: 3px; padding: 3px; border-radius: 12px; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--lift); }
.brains button { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; border: 0; border-radius: 9px; background: transparent;
                 font: 600 13px/1 var(--mono); color: var(--ink-2); cursor: pointer; }
.brains button:hover { background: var(--hover); color: var(--ink); }
.brains button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.brains .bd { width: 7px; height: 7px; border-radius: 50%; box-shadow: inset 0 0 0 1.3px currentColor; opacity: .55; }
.brains .bd.on { background: var(--green); box-shadow: none; opacity: 1; }
.brains .n { font-size: 11px; font-weight: 400; opacity: .7; }
/* the bottom bar: the navigator centred, validation, Live and builders at the right; the navigator moves left when the right needs the room */
.bar { position: fixed; left: 0; right: 0; bottom: 14px; z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; column-gap: 12px;
       padding: 0 22px; pointer-events: none; }
.bar > * { pointer-events: auto; }
.chrome-r { grid-column: 3; justify-self: end; display: grid; justify-items: end; gap: 5px; }
.built { padding: 1px 6px; border-radius: 4px; background: rgba(245,244,239,.92); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.pills { display: flex; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
        box-shadow: var(--lift); font: 12px/1 var(--mono); cursor: pointer; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
.pill:hover { border-color: var(--ink-3); color: var(--ink); }
.pill svg { width: 15px; height: 15px; flex: none; }
.pill[aria-current="true"] { background: var(--gold); border-color: var(--gold-line); color: var(--ink); }
.live i { width: 7px; height: 7px; border-radius: 50%; background: var(--none); }
.live[aria-pressed="true"] { color: var(--ink); }
.live[aria-pressed="true"] i { background: var(--green); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px rgba(155,188,108,.35); } }

/* the navigator: the loop in miniature, with previous and next */
.dock { grid-column: 2; min-width: 0; max-width: 100%; display: flex; align-items: center; gap: 10px; padding: 6px;
        border-radius: 16px; background: rgba(245,244,239,.95); border: 1px solid var(--line); box-shadow: var(--lift);
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.steps { display: flex; align-items: center; gap: 5px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.dk { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 11px; border: 1px solid var(--line); border-radius: 9px;
      background: var(--tile); font: 700 11.5px/1 var(--mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); cursor: pointer; white-space: nowrap; }
.dk b { font-weight: 700; color: var(--ink-3); }
.dk:hover { border-color: var(--ink-3); }
.dk.end { border-color: transparent; background: transparent; text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12.5px; color: var(--ink-2); }
.dk.end:hover { background: var(--hover); }
.dk[aria-current="true"] { background: var(--gold); border-color: var(--gold-line); color: var(--ink); }
.dk[aria-current="true"] b { color: var(--ink); }
.dk .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.dk .dot.s-none { background: transparent; box-shadow: inset 0 0 0 1.3px var(--none); }
.dk-ar { flex: none; position: relative; width: 16px; height: 4px; margin-right: 5px; background: var(--arrow); opacity: .7; }
.dk-ar::after { content: ""; position: absolute; right: -5px; top: -3px; border: 5px solid transparent; border-right: 0; border-left: 6px solid var(--arrow); }
.dk-ar.live { background: var(--gold); opacity: 1; overflow: visible; }
.dk-ar.live::after { border-left-color: var(--gold); }
.dk-ar.live::before { content: ""; position: absolute; inset: 1px 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.9) 0 4px, transparent 4px 11px); animation: kf 1.4s linear infinite; }
.dk-sep { flex: none; width: 1px; height: 22px; margin: 0 4px; background: var(--line); }
.arr { flex: none; display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; border-radius: 50%; background: var(--ink); color: var(--paper); cursor: pointer; }
.arr:hover { background: #000; }
.arr:disabled { opacity: .22; cursor: default; }
.arr svg { width: 16px; height: 16px; }
.curtain { position: fixed; inset: 0; z-index: 25; background: var(--paper); opacity: 0; visibility: hidden; pointer-events: none; }

/* ---------------------------------------------------------------- cover: the loop, as large as the screen allows */
.cover { min-height: 100vh; padding: calc(var(--top) + 18px) 32px var(--bottom); display: flex; flex-direction: column;
         background-image: radial-gradient(circle at 2px 2px, rgba(215,207,182,.65) 1px, transparent 1.4px); background-size: 16px 16px; }
.cover-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 48px; flex-wrap: wrap; width: 100%; max-width: 1680px; margin: 0 auto; }
.cover h1 { margin: 0; font: 400 clamp(34px, 4vw, 60px)/1.06 var(--serif); letter-spacing: -.01em; max-width: 19ch; text-wrap: balance; }
.cover .sub { margin: 0; max-width: 46ch; font: 400 18px/1.55 var(--sans); color: var(--ink-2); }
.cover-r { display: grid; gap: 12px; }
.flow { flex: 1; min-height: 0; width: 100%; max-width: 1680px; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; }
.flow .fsc { width: 100%; }
/* the loop takes the height the heading and the key leave (--head and --keyh are measured), so the overview fits however they wrap */
.flow svg { display: block; width: 100%; height: auto; max-height: calc(100vh - var(--top) - var(--bottom) - var(--head, 108px) - var(--keyh, 28px) - 14px); margin: 0 auto; overflow: visible; }
.key { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 22px; margin: 4px auto 6px; font-size: 12px; color: var(--ink-3); }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.key .kf, .key .ki { width: 30px; height: 7px; background: var(--gold); position: relative; overflow: hidden; }
.key .kf::after { content: ""; position: absolute; inset: 2px 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.85) 0 6px, transparent 6px 16px);
                  animation: kf 1.4s linear infinite; }
@keyframes kf { from { background-position: 0 0; } to { background-position: 16px 0; } }
.key .ki { height: 4px; background: var(--arrow); opacity: .7; }
.key .ko { width: 14px; height: 10px; border-radius: 3px; background: var(--gold); border: 1px solid var(--gold-line); }
.key .kc { width: 16px; height: 12px; border-radius: 3px; background: #333; position: relative; }
.key .kc::after { content: ""; position: absolute; left: 6px; top: 3px; border: 3px solid transparent; border-right: 0; border-left: 5px solid #fff; }
.key .gl { font-size: 13px; }
.key .ks { display: inline-flex; align-items: center; gap: 4px; height: 17px; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper);
           font: 500 10.5px/1 var(--mono); font-style: normal; color: var(--ink-2); }
.key .ks.plan { border-style: dashed; color: var(--ink-3); }
.key .ks .gl { font-size: 10.5px; }

/* flowchart (inline SVG); geometry and colours follow pi's api-workflow diagram */
.fl text { font-family: var(--mono); }
.fl .t { font-size: 17px; font-weight: 700; fill: var(--ink); }
.fl .t.sm, .fl .t.md { font-size: 15px; }
.fl .s { font-size: 13px; font-weight: 500; fill: var(--ink-2); }
.fl .s.xs { font-size: 12px; }
.fl .lbl { font-size: 13px; font-weight: 500; fill: var(--ink); }
.fl .ft { font-size: 19px; font-weight: 700; fill: var(--ink); }
.fl .fs { font-size: 13px; font-weight: 500; fill: var(--ink-3); }
.fl .mask { fill: var(--paper); }
.fl .frame { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 6; }
.fl .gl { font-size: 15px; fill: var(--c); }
.fl .tc { stroke: var(--line); stroke-width: 1.5; }
.fl .hint { font-size: 12px; font-weight: 500; fill: var(--ink); text-decoration: underline; text-decoration-color: var(--line); cursor: pointer; }
.nd, .fb, .gchip, .clip, .sk { cursor: pointer; outline: none; }
/* skill tags: the playbook skills a step uses, hung under its node; a planned skill is dashed with ○, like an idle node */
.sk .kb { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s; }
.sk .kt { font-size: 11px; font-weight: 500; fill: var(--ink-2); }
.sk .kg { fill: var(--none); font-weight: 700; }
.sk.more .kb { fill: var(--tile); }
.sk.plan .kb { fill: rgba(245,244,239,.85); stroke-dasharray: 4 3; }
.sk.plan .kt { fill: var(--ink-3); }
.sk:hover .kb, .sk:focus-visible .kb { stroke: var(--ink-3); stroke-width: 2; }
.sk:hover .kt, .sk:focus-visible .kt { fill: var(--ink); }
.nd .bg { fill: var(--tile); stroke: var(--line); stroke-width: 1.5; transition: stroke .15s, fill .15s; }
.nd .nid { font-size: 13px; font-weight: 700; fill: var(--ink-3); }
.nd .pips { font-size: 12px; font-weight: 500; }
.nd .pid { fill: var(--ink-3); }
.nd .pg { fill: var(--c); font-weight: 700; }
.nd.idle .bg { fill: rgba(245,244,239,.85); stroke-dasharray: 5 4; }
.nd.idle .t { fill: var(--ink-3); }
.nd.on .bg { fill: var(--gold); stroke: var(--gold-line); }
.nd.on .nid { fill: var(--ink); }
.nd.on .s-prog, .nd.on.s-prog .gl { fill: var(--ink); }
.nd.regr .bg { stroke: var(--regr); stroke-width: 2.5; }
.nd:hover .bg, .nd:focus-visible .bg { stroke: var(--ink-3); stroke-width: 2; }
.nd.on:hover .bg, .nd.on:focus-visible .bg { stroke: var(--ink); }
.fb .box, .gchip .box { fill: var(--paper); stroke: none; }
.fb.on .box, .gchip.on .box { fill: var(--gold); stroke: var(--gold-line); stroke-width: 1.5; }
.fb:hover .t, .gchip:hover .t, .fb:focus-visible .t, .gchip:focus-visible .t { text-decoration: underline; }
.lead rect.card { fill: var(--white); stroke: var(--line); stroke-width: 1.5; }
.lead .tile-el { fill: var(--paper); stroke: var(--ink-3); stroke-width: 1.5; }
.lead .z { font-size: 7px; font-weight: 500; fill: var(--ink-3); }
.lead .sym { font-size: 14px; font-weight: 700; fill: var(--ink); }
.io .b { fill: var(--tile); stroke: var(--line); stroke-width: 1.5; }
.io .f { fill: var(--paper); stroke: var(--line); stroke-width: 1.5; }
.io .d { fill: var(--arrow); }
.arm { fill: var(--tile); stroke: var(--ink-3); stroke-width: 3; stroke-linejoin: round; opacity: .55; }
.arm .w { fill: var(--gold); }
/* clips inside the flowchart: real footage you can open */
.fo { position: relative; width: 100%; height: 100%; border-radius: 8px; overflow: hidden; background: #2a2823; box-shadow: 0 0 0 1.5px var(--line);
      transition: box-shadow .15s; }
.fo img, .fo video { width: 100%; height: 100%; object-fit: cover; display: block; }
.fo .fo-l { position: absolute; left: 4px; bottom: 4px; max-width: calc(100% - 8px); padding: 3px 5px; border-radius: 4px; background: rgba(245,244,239,.95);
            font: 600 9.5px/1.2 var(--mono); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fo video.wide, .fo img.wide { object-fit: contain; background: #000; }  /* a two-camera strip shows whole, letterboxed */
.fo .fo-p { position: absolute; right: 5px; top: 5px; width: 18px; height: 18px; border-radius: 50%; background: rgba(0,0,0,.6); }
.fo .fo-p::after { content: ""; position: absolute; left: 7px; top: 5px; border: 4px solid transparent; border-right: 0; border-left: 6px solid #fff; }
.clip:hover .fo, .clip:focus-visible .fo { box-shadow: 0 0 0 2.5px var(--ink); }
/* the data-source switcher at the loop's start: one row per validation.yaml track; the pressed one is what the whole page
   shows. Like the brain switch: paper box, ink fill when pressed; a track not started is dashed with ○, like a planned skill */
.tsw { display: grid; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 12px; background: var(--paper); box-shadow: var(--lift); }
.tsw-o { display: grid; grid-template-columns: 17px minmax(0, 1fr); column-gap: 7px; align-content: center; height: 46px; padding: 0 10px;
         border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: left; cursor: pointer; color: var(--ink-2); }
.tsw-o .gl { grid-row: 1 / 3; align-self: center; font-size: 16px; }
.tsw-o .tn { font: 700 14px/1.25 var(--mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tsw-o .tw { font: 400 12px/1.3 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tsw-o:hover { background: var(--hover); }
.tsw-o.plan { border-style: dashed; border-color: var(--line); }
.tsw-o.plan .tn { color: var(--ink-3); }
.tsw-o[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); cursor: default; }
.tsw-o[aria-pressed="true"] .tn, .tsw-o[aria-pressed="true"] .tw, .tsw-o[aria-pressed="true"] .gl { color: var(--paper); }
.tsw-o[aria-pressed="true"] .tw { opacity: .78; }
/* a track with no work on any step yet: its status, why and scope, one line each, in a card where the lead brain would
   sit, above the loop regions (the full text is in the track's card) */
.tnote-g { cursor: pointer; outline: none; }
.tnote { height: 100%; overflow: hidden; padding: 8px 16px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--white); transition: border-color .15s; }
.tnote-g:hover .tnote, .tnote-g:focus-visible .tnote { border-color: var(--ink-3); }
.tnote .tk { margin: 0 0 2px; font: 700 13px/1.3 var(--mono); letter-spacing: .02em; text-transform: uppercase; color: var(--ink); }
.tnote .tk .gl { margin-right: 7px; }
.tnote .tk span { font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--ink-3); }
.tnote .tw { margin: 0; font: 400 14px/1.35 var(--sans); color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tnote .ts { margin: 2px 0 0; font: 400 12px/1.35 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* the two self-optimization loops (story.yaml `loops`): at rest a soft tint behind the loop's nodes, a small capital label
   and one trend glyph per shown brain. Hover or keyboard focus opens a panel in the quietest space beside the region
   (never over a node); a click or tap opens the same as a card, from the bottom on touch screens */
.lp-r { fill: var(--tan); fill-opacity: .3; stroke: transparent; stroke-width: 1; cursor: pointer; transition: fill-opacity .15s, stroke .15s; }
.lp-r.given { fill-opacity: .12; stroke: var(--line); stroke-dasharray: 5 5; }
.lp-r.hot { fill-opacity: .5; stroke: var(--ink-3); }
.lp-r.kb { stroke: var(--ink); stroke-width: 2; }
.lpl { cursor: pointer; outline: none; }
.lpl .lt { font-size: 11.5px; font-weight: 700; letter-spacing: .1em; fill: var(--ink-3); transition: fill .15s; }
.lpl .lg { font-size: 12.5px; font-weight: 700; fill: var(--c); }
.lpl:hover .lt, .lpl:focus-visible .lt, .lpl.hot .lt { fill: var(--ink); }
.fl.off .lpl { opacity: .7; }
.lpp { position: fixed; left: 0; top: 0; z-index: 29; width: var(--lpw, 440px); padding: 11px 15px 10px; border: 1px solid var(--line); border-radius: 12px;
       background: rgba(245,244,239,.97); box-shadow: var(--lift); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
       pointer-events: none; opacity: 0; visibility: hidden; transform: translateY(4px);
       transition: opacity .12s ease-in, transform .12s ease-in, visibility 0s linear .12s; }
.lpp.on { opacity: 1; visibility: visible; transform: none; transition: opacity .15s ease-out, transform .15s ease-out; }
/* no room for one column beside the region (a short window, a wide integrity chip): the same blocks side by side */
.lpp.wide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 20px; align-items: start; }
.lpp.wide .lpx-k { margin-top: 2px; }
/* the panel's blocks, shared with the loop's card: heading, objective, headline checks, what each step optimized, source */
.lpx-h { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin: 0 0 2px; font: 700 11.5px/1.4 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.lpx-h .tr { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--ink-2); white-space: nowrap; }
.lpx-h .tr .gl { margin-right: 3px; }
.lpx-h .who { margin-left: auto; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--ink-3); white-space: nowrap; }
.lpx-o { margin: 0 0 5px; font: 400 14.5px/1.3 var(--sans); color: var(--ink-2); }
.lpx-n { width: 100%; border-collapse: collapse; font: 400 11.5px/1.2 var(--mono); }
.lpx-n td { padding: 2px 0; border-top: 1px solid var(--divider); vertical-align: middle; white-space: nowrap; }
.lpx-n td.g { width: 20px; padding-right: 6px; font-size: 12px; }
.lpx-n td.n { max-width: 0; width: 100%; overflow: hidden; text-overflow: ellipsis; color: var(--ink); padding-right: 8px; }

.lpx-s { list-style: none; margin: 0; padding: 0; }

.lpx-e { margin: 2px 0 0; font: 400 13.5px/1.4 var(--sans); color: var(--ink-3); }
.lpx-f { margin: 6px 0 0; font: 400 11.5px/1.35 var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lpx-f b { font-weight: 600; color: var(--ink-2); }
.sh-body .lpx-s li > span { white-space: normal; overflow: visible; }
.sh-body .lpx-s li { grid-template-columns: 110px minmax(0, 1fr); padding: 7px 0; }
.sh-body .lpx-s .d { display: block; margin-top: 2px; font: 400 12px/1.4 var(--mono); color: var(--ink-3); font-style: normal; }
.sh-body .lpx-n td { padding-top: 6px; padding-bottom: 6px; }
.sh-body .lpx-n td.n { white-space: normal; }
.sh-body .lpx-n .sp { width: 80px; height: 18px; }
.sh-body .lpx-n td.sp { width: 80px; }
.sh-body .lpx-f { white-space: normal; font-size: 12.5px; }
.fl.off .sk { opacity: .55; }  /* a track not started: its loop is drawn, greyed, with nothing on it */
.ar { fill: none; stroke-linejoin: round; }
.ar.gold { stroke: var(--gold); stroke-width: 9; }
.ar.gold.m { stroke-width: 7; }
.ar.tan { stroke: var(--arrow); stroke-width: 5; opacity: .7; }
.ar.tan.solid { opacity: 1; }
.ar.tan.dash { stroke-dasharray: 10 8; }
.ar.thin { stroke: var(--arrow); stroke-width: 3; }
.ar.green { stroke: var(--green); stroke-width: 8; }
.ar.green.idle { opacity: .45; }
.fw { fill: none; stroke: #fff; stroke-width: 4.05; stroke-dasharray: 10 34; opacity: .8; }
.fw.m { stroke-width: 3.15; }
.fw.thin { stroke-width: 2.25; }
.fg { fill: none; stroke: var(--green-deep); stroke-width: 3.6; stroke-dasharray: 10 34; opacity: .8; }
[data-flow] { animation: flow 1.4s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -44; } }

/* ---------------------------------------------------------------- chapters: one page each, laid out as a bento */
.chapters { position: relative; overflow: hidden; }
.track { display: block; }
.h-mode .track { display: flex; width: max-content; will-change: transform; }
.ch { position: relative; width: auto; padding: var(--top) 0 var(--bottom); }
.h-mode .ch { width: var(--pw, 100vw); flex: none; }
.bento { display: flex; flex-direction: column; gap: 12px; max-width: 1760px; margin: 0 auto; padding: 16px 16px 20px; }
.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
@media (min-width: 960px) and (min-height: 560px) {
  .ch { height: 100vh; }
  .bento { display: grid; height: 100%; padding: 6px 32px 14px; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); }
  .t-intro { grid-area: 1 / 1 / 4 / 5; }
  .t-checks { grid-area: 4 / 1 / 7 / 5; }
  .t-hero { grid-area: 1 / 5 / 5 / 10; }
  .t-reel { grid-area: 5 / 5 / 7 / 10; }
  .bento.solo .t-hero { grid-area: 1 / 5 / 7 / 10; }
  .side { grid-area: 1 / 10 / 7 / 13; }
  .side > * { flex: 1 1 0; }
  .side > .t-log { flex: 1.15 1 0; }
}
.tile { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 16px 18px;
        border-radius: 12px; background: var(--tile); border: 1px solid var(--divider); }
.tile[data-open] { cursor: pointer; transition: border-color .2s; }
.tile[data-open]:hover { border-color: var(--line); }
.th { display: flex; align-items: baseline; gap: 10px; margin: 0 40px 10px 0; font: 600 12.5px/1.3 var(--mono); color: var(--ink-2); }
.th span { font-weight: 400; color: var(--ink-3); }
.xp { position: absolute; top: 12px; right: 12px; z-index: 2; display: grid; place-items: center; width: 32px; height: 32px; padding: 0; border: 0;
      border-radius: 50%; background: rgba(245,244,239,.9); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); cursor: pointer; color: var(--ink); }
.xp:hover { background: var(--paper); }
.xp svg { width: 15px; height: 15px; }
.more-fade { -webkit-mask-image: linear-gradient(#000 calc(100% - 44px), transparent); mask-image: linear-gradient(#000 calc(100% - 44px), transparent); }

/* intro: sits on the paper like a page heading */
.t-intro { position: relative; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; padding: 2px 16px 0 0; }
.mini { display: block; width: min(100%, 470px); height: auto; overflow: visible; margin: 0 0 4px -4px; }
.mini .mn { fill: var(--gold); stroke: var(--gold-line); stroke-width: 1.5; }
.mini .mid { font-size: 14px; font-weight: 700; fill: var(--ink); }
.mini .mt { font-size: 13px; font-weight: 700; fill: var(--ink); }
.mini .lbl { font-size: 12px; font-weight: 500; fill: var(--ink-2); }
.mini text { font-family: var(--mono); }
.kick { margin: 10px 0 0; font-size: 12px; color: var(--ink-3); }
.t-intro h2 { margin: 4px 0 12px; font: 400 clamp(30px, 2.9vw, 46px)/1.08 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
.claim { margin: 0 0 16px; max-width: 44ch; font: 400 18px/1.55 var(--sans); color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.chip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 3px 11px; border: 1px solid var(--line); border-radius: 999px;
        background: var(--paper); font-size: 12px; color: var(--ink-2); cursor: pointer; text-align: left; }
.chip:hover { border-color: var(--ink-3); }
.chip .gl { font-size: 12.5px; }
.chip.plan { border-style: dashed; color: var(--ink-3); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; height: 34px; padding: 0 14px; border: 0; border-radius: 8px;
       background: var(--button); font: 600 12.5px/1 var(--mono); cursor: pointer; color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--button-hover); }
.btn svg { width: 14px; height: 14px; }

/* checks */
.cl { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; }
.cl .cg { padding: 10px 0 4px; font: 500 11.5px/1.2 var(--mono); color: var(--ink-3); }
.cl .cg:first-child { padding-top: 0; }
.cr { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 10px; align-items: baseline; width: 100%; padding: 7px 0; border: 0;
      border-top: 1px solid var(--divider); background: none; text-align: left; cursor: pointer; }
.cr .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 15px/1.3 var(--sans); }
.cr:hover .n { text-decoration: underline; text-decoration-color: var(--line); }
.cr .v { font: 600 13px/1.3 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.cr .v small { margin-left: 8px; font-size: 11.5px; font-weight: 400; color: var(--ink-3); }
.cr .v .bt { margin-right: 4px; }
.bt { display: inline-block; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; font: 400 10.5px/16px var(--mono); color: var(--ink-2); vertical-align: 1px; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 600 11px/16px var(--mono); vertical-align: 2px; background: var(--t); color: var(--c); }

/* numbers */
.t-num .nl { margin: 0 40px 0 0; font: 500 15px/1.35 var(--sans); }
.t-num .nv { margin-top: auto; padding-top: 8px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 22px; }
.t-num .nv > div { display: grid; gap: 4px; justify-items: start; }
.big { font: 400 clamp(40px, 4vw, 68px)/1 var(--serif); letter-spacing: -.02em; font-variant-numeric: lining-nums tabular-nums; color: var(--ink); }
.big.sm { font-size: clamp(32px, 2.8vw, 46px); }
.s-none .big { color: var(--ink-3); }
.ns { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-2); }
.sp { display: block; width: 100%; height: 34px; margin-top: 10px; overflow: visible; }
.sp .ln { fill: none; stroke: var(--ink-2); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
.sp .tg { stroke: var(--arrow); stroke-width: 1; stroke-dasharray: 3 3; }
.sp .dot { stroke: var(--c); stroke-width: 7; stroke-linecap: round; fill: none; }

/* media */
.t-hero { margin: 0; padding: 10px; }
.mf { position: relative; flex: 1; min-height: 0; display: flex; border-radius: 8px; overflow: hidden; background: var(--white); }
.mf > img, .mf > video { width: 100%; height: 100%; object-fit: contain; display: block; }
.mf.dark { background: var(--media); }
.mf.split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 6px; background: transparent; }
.mf.split > div { min-height: 0; border-radius: 8px; overflow: hidden; }
.mf.split video, .mf.split img { width: 100%; height: 100%; object-fit: contain; display: block; }
.mf.split .stack { display: grid; gap: 6px; grid-auto-rows: minmax(0, 1fr); background: transparent; }
.mf.split .stack img { background: var(--white); border-radius: 8px; }
.mf.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: transparent; }
.mf.pair figure { position: relative; margin: 0; min-height: 0; border-radius: 8px; overflow: hidden; background: var(--media); }
.mf.pair video { width: 100%; height: 100%; object-fit: contain; display: block; }
.mf.wipe { background: var(--media); user-select: none; }
.mf.wipe img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.mf.wipe .wr { clip-path: inset(0 0 0 var(--p)); }
.mf.wipe .wbar { position: absolute; top: 0; bottom: 0; left: var(--p); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,.6); pointer-events: none; }
.mf.wipe input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.wl { position: absolute; top: 8px; z-index: 1; padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; pointer-events: none; }
.wl.l { left: 8px; } .wl.r { right: 8px; }
.mf.none { align-items: center; justify-content: center; padding: 24px; background: transparent; border: 1px dashed var(--line); text-align: center; color: var(--ink-3); font-size: 12.5px; }
.mf.none p { margin: 0; max-width: 40ch; line-height: 1.7; }
.mf.miss { align-items: center; justify-content: center; color: var(--ink-3); font-size: 12px; padding: 16px; }
.strip { display: flex; gap: 6px; padding-top: 6px; }
.strip button { flex: none; width: 64px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--white); cursor: pointer; }
.strip button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.strip button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.fc { display: grid; gap: 2px; padding: 10px 6px 2px; }
.fc b { font: 600 15px/1.3 var(--sans); }
.fc .cap { font: 400 14px/1.4 var(--sans); color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.fc .by { font-size: 11.5px; color: var(--ink-3); }
.t-hero .xp { top: 20px; right: 20px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); grid-auto-rows: max-content; gap: 10px; align-content: start;
          flex: 1; min-height: 0; overflow: hidden; padding: 3px; }
.thumb { position: relative; display: block; width: 100%; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: #deddd7; cursor: pointer; }
.thumb::before { content: ""; display: block; padding-top: 56.25%; }  /* 16:9 */
.thumb img, .thumb video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(transparent 45%, rgba(0,0,0,.3)); pointer-events: none; }
.thumb .tl { position: absolute; left: 4px; bottom: 4px; z-index: 1; max-width: calc(100% - 8px); padding: 3px 5px; border-radius: 4px; background: rgba(245,244,239,.95);
             font-size: 10px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.thumb[aria-pressed="true"] .tl { background: rgba(0,0,0,.85); color: #fff; }

/* log and cost */
.lg { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; }
.lg li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; padding: 8px 0; border-top: 1px solid var(--divider); }
.lg li:first-child { border-top: 0; padding-top: 0; }
.lg .gl { font-size: 11px; line-height: 20px; }
.lg p { margin: 0; font: 400 14px/1.4 var(--sans); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.lg .m { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ink-3); }
.lg .empty { display: block; color: var(--ink-3); }
.cost-b { display: grid; gap: 6px; padding: 8px 0; border-top: 1px solid var(--divider); }
.cost-b:first-of-type { border-top: 0; padding-top: 0; }
.cost-b > b { font: 600 13px/1.3 var(--mono); }
.ms { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.m b { display: block; font: 400 24px/1.1 var(--serif); font-variant-numeric: lining-nums tabular-nums; }
.m span { font-size: 11px; color: var(--ink-3); }

/* narrow screens: stacked tiles, natural heights */
@media (max-width: 959px), (max-height: 559px) {
  :root { --top: 60px; --bottom: 74px; }
  .built, .brains .n, .dk span.nm { display: none; }
  .chrome-l { left: 12px; gap: 10px; }
  .bar { grid-template-columns: minmax(0, 1fr); row-gap: 8px; bottom: 10px; padding: 0 10px; }
  .chrome-r { grid-area: 1 / 1; }  /* small screens: live and builders float above the navigator */
  .logo { font-size: 22px; }
  .brains button { padding: 0 9px; font-size: 12px; }
  .cover { padding: calc(var(--top) + 16px) 16px var(--bottom); min-height: auto; }
  .flow .fsc { overflow-x: auto; }
  .flow svg { min-width: 900px; max-height: none; }
  .key { justify-content: flex-start; }
  .t-hero { min-height: 340px; }
  .t-hero .mf { min-height: 240px; }
  .t-num, .t-checks, .t-log, .t-reel, .t-cost { min-height: 200px; }

}
@media (max-width: 560px) { .pill span { display: none; } }
@media (min-width: 960px) and (max-width: 1499px) {  /* laptops: a tighter navigator, so validation, Live and builders fit beside it */
  .built .t { display: none; }  /* the build time stays in the tooltip */
  .bar { padding: 0 14px; }
  .dock { gap: 8px; }
  .steps { gap: 4px; }
  .dk { padding: 0 8px; }
  .key { column-gap: 16px; }  /* the key stays on one line at 1280 */
}
@media (min-width: 960px) and (max-width: 1199px) { .built, .pill span { display: none; } }
@media (min-width: 960px) and (min-height: 560px) and (max-height: 820px) {
  .t-intro { grid-area: 1 / 1 / 5 / 5; }   /* short screens: the heading gets a row from the checks */
  .t-checks { grid-area: 5 / 1 / 7 / 5; }
  .t-intro h2 { font-size: clamp(26px, 2.4vw, 36px); }
  .claim { font-size: 16px; margin-bottom: 10px; }
  .mini { width: min(100%, 400px); }
}

/* ---------------------------------------------------------------- ledger: the full record, normal vertical reading */
.ledger { max-width: 1240px; margin: 0 auto; padding: calc(var(--top) + 48px) 32px calc(var(--bottom) + 48px); }
.ledger > header h2 { margin: 0 0 10px; font: 400 clamp(36px, 4vw, 56px)/1.06 var(--serif); letter-spacing: -.01em; }
.ledger > header p { margin: 0 0 40px; max-width: 60ch; font: 400 18px/1.55 var(--sans); color: var(--ink-2); }
.lg-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.ledger h3 { margin: 0 0 14px; font: 400 24px/1.3 var(--sans); }
.ledger section + section { margin-top: 36px; }
.tlist { list-style: none; margin: 0; padding: 0; }
.tlist li { display: grid; grid-template-columns: 16px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--divider); }
.tlist .gl { font-size: 12px; line-height: 23px; }
.tlist p { margin: 0; font: 400 16px/1.45 var(--sans); overflow-wrap: anywhere; }
.tlist .m { display: block; margin-top: 3px; font-size: 12px; color: var(--ink-3); }
.tlist p.d { margin-top: 3px; font-size: 15px; color: var(--ink-2); }
.tlist .chips { margin: 8px 0 0; }
.evs { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 4px; font-size: 12px; }
.evs a { overflow-wrap: anywhere; }
.evs .missing { color: var(--ink-3); text-decoration: line-through; }
.lnk { padding: 0; border: 0; background: none; font: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; cursor: pointer; text-align: left; }
.lnk:hover { text-decoration-color: currentColor; }
.box { padding: 18px 20px; border: 1px solid var(--divider); border-radius: 12px; }
.box + .box { margin-top: 12px; }
.callers { display: grid; gap: 4px; font-size: 12.5px; color: var(--ink-2); }
.callers b { color: var(--ink); }
.callers .err { color: var(--regr); }
.callers .m { display: block; font-size: 11.5px; color: var(--ink-3); }
.hyp .hid { margin: 0 0 6px; font-weight: 700; font-size: 13px; }
.hyp .hid span { font-weight: 400; color: var(--ink-3); margin-left: 8px; }
.hyp p.hc { margin: 0 0 8px; font: 400 16px/1.5 var(--sans); }
.hyp p.hm { margin: 0; font-size: 12.5px; color: var(--ink-2); }
details.rd { margin: 14px 0 0; }
details.rd > summary { cursor: pointer; font: 600 13px/1.4 var(--mono); color: var(--ink-2); list-style: none; }
details.rd > summary::-webkit-details-marker { display: none; }
details.rd > summary::before { content: "+"; display: inline-block; width: 16px; color: var(--ink-3); }
details.rd[open] > summary::before { content: "\2212"; }
details.rd > div, details.rd > ul { margin-top: 10px; }
.src { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--divider); font-size: 12px; color: var(--ink-3); }
.src p { margin: 4px 0; }
@media (max-width: 860px) { .lg-grid { grid-template-columns: 1fr; } .ledger { padding: calc(var(--top) + 32px) 16px calc(var(--bottom) + 32px); } }

/* ---------------------------------------------------------------- builders: the closing page, after creativeclaw.co's footer.
   A dark panel, the names at top right, the wordmark across the full width, cut off by the panel's lower edge. */
.builders { height: 100vh; padding: var(--top) 16px var(--bottom); }
.bd-panel { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; border-radius: 32px; background: var(--ink); color: var(--paper); }
.bd-who { align-self: flex-end; min-width: 210px; padding: 48px 56px 0 24px; }
.bd-who p { margin: 0 0 14px; font: 500 12px/1 var(--mono); color: rgba(245,244,239,.55); }
.bd-who ul { list-style: none; margin: 0; padding: 0; font: 400 22px/1.5 var(--sans); }
.bd-note { margin: auto 0 0; padding: 24px 56px 6px; font: 400 15px/1.5 var(--sans); color: rgba(245,244,239,.6); }
.bd-mark { margin: 0 0 -.13em; padding: 0 30px; font: 400 14vw/.85 var(--display); letter-spacing: -.03em; white-space: nowrap; user-select: none; }
.bd-mark span { display: inline-block; }
.bd-mark i { font-style: normal; color: rgba(245,244,239,.5); }
.bd-mark em { display: none; }
@media (max-width: 959px), (max-height: 559px) {

<script>

const RELOAD_S = 30;
const $ = (s, r = document) => r.querySelector(s);

const SS = {not_started: ['none', '○', 'not started'], in_progress: ['prog', '◐', 'in progress'],
  unscored: ['prog', '◐', 'in progress · not scored yet'],

const XP = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5L9 7M6.5 13.5h-4v-4M2.5 13.5L7 9"/></svg>';

let live = store.get('live', true);
const picks = {};  // section -> media id the viewer picked in its reel

// ------------------------------------------------------------------ data tracks: the whole page shows one at a time

const TRACKS = D.tracks || [];
const PRIMARY = D.primary || (TRACKS[0] || {}).id;
const trackById = (id) => TRACKS.find((t) => t.id === id);
let cur = hashArg('track') || store.get('track', PRIMARY);
if (!trackById(cur)) cur = PRIMARY;
const T = (t = cur) => trackById(t) || TRACKS[0];
const V = (t = cur) => D.views[t] || D.views[PRIMARY];  // the track's text from story.yaml (never another track's claims)
const tlabel = (t = cur) => (T(t) || {}).label || t;
const TSTATE = {not_started: 'not_started', planned: 'not_started', active: 'in_progress', in_progress: 'in_progress',
  blocked: 'failing', done: 'passing', complete: 'passing', completed: 'passing'};
const trackState = (t) => TSTATE[t.status] || 'in_progress';  // the track's status, set by hand in validation.yaml
const trackWords = (t) => String(t.status).replace(/_/g, ' ');

// ------------------------------------------------------------------ data helpers (a track argument defaults to the shown one)
const label = (b) => D.brain_labels[b] || b;
const tag = (b) => (b === 'claude' ? 'stand-in' : String(label(b)).toLowerCase());
const res = (b) => D.results[b];
const tres = (b, t = cur) => (res(b) && res(b).tracks[t]) || null;  // one brain's results on one track
// brains on the page: every brain with measurements or work (events, media) on the track, or the one picked
const shown = (t = cur) => (sel === 'all' ? D.brains.filter((b) => { const r = tres(b, t); return r && (r.n || r.act); }) : [sel]);

// a step as one brain sees it; status.py marks work with no measured check `unscored`: shown ◐ "not scored yet"
const stageView = (b, sid, t = cur) => { const r = tres(b, t), v = r ? r.stages[sid] || null : null;
  return v && v.unscored ? {...v, state: 'unscored'} : v; };

const cstate = (cv) => (!cv ? 'none' : cv.regressed ? 'regr' : cv.state);
const latest = (cv) => (cv ? cv.recent[0] : null);
const RAW = Object.fromEntries(D.stages.map((s) => [s.id, s]));

function stageOf(id, t = cur) {

const NUM = Object.fromEntries(MAIN.map((s, i) => [s.id, String(i + 1)]));  // steps are numbered; stage codes stay internal
const secById = (id) => SECS.find((s) => s.id === id);

const secMark = (s) => NUM[s.id] || (s.role === 'feedback' ? '↺' : '');

  const sec = secOf(id), st = RAW[id]; return (sec && sec.parts[id]) || (sec && sec.stages.length === 1 ? sec.short : st ? st.name : id); };

const pageName = (id) => (id === 'top' ? 'Overview' : id === 'ledger' ? 'Ledger' : id === 'builders' ? 'Builders' : `${secMark(secById(id))} ${secById(id).short}`.trim());

  .concat(D.media.filter((m) => m.track === t && m.step === 'input' && m.files.some((f) => f.exists)).map(asClip));
const evOf = (t = cur) => D.events.filter((e) => e.track === t && brainOk(e));

const placeKicker = (step, t) => { const sec = secOf(step); return `${step === 'input' ? 'Real footage' : sec ? secKicker(sec) : 'Unplaced'} · ${tlabel(t)} · `; };

function fmt(v) {

  if (typeof v !== 'number') return String(v);
  if (Number.isInteger(v)) return v.toLocaleString('en-US');

function secState(sec, b, t = cur) {

  if (raw.every((x) => x === 'not_started')) return 'not_started';
  if (raw.every((x) => x === 'not_started' || x === 'unscored')) return 'unscored';
  const sts = raw.map((x) => (x === 'unscored' ? 'not_started' : x));

}

const secWorst = (sec, t = cur) => { const bs = shown(t); return bs.length ? worstOf(bs.map((b) => secState(sec, b, t))) : 'not_started'; };

// ------------------------------------------------------------------ the loop panel: hover or keyboard focus on a loop region
// It opens in the quietest space beside the region: every spot next to its four sides is tried, any spot that touches a
// node, the region itself or the page chrome is ruled out, and the one covering the least text wins. With no free spot

function placeLoop(R, W, H, strict) {  // strict: the page's headline and subtitle are off limits too

  if (strict) hard.push(...heads);

function dock() {
  const item = (id, html, cls, title) => `<button type="button" class="dk ${cls}" data-go="${esc(id)}" title="${esc(title)}" aria-current="false">${html}</button>`;
  const dot = (s) => `<span class="dot s-${secClass(s, secWorst(s))}"></span>`;
  let h = item('top', 'Overview', 'end', 'The whole loop');
  MAIN.forEach((s, i) => {
    if (i) h += `<i class="dk-ar${secLive(s) ? ' live' : ''}" aria-hidden="true"></i>`;
    h += item(s.id, `<b>${i + 1}</b><span class="nm">${esc(s.short)}</span>${dot(s)}`, '', `Step ${i + 1}, ${s.node} (${tlabel()}): ${ST(s).title}`);
  });
  const extra = SECS.filter((s) => s.role !== 'main');
  if (extra.length) h += '<i class="dk-sep" aria-hidden="true"></i>' + extra.map((s) => item(s.id, `${s.role === 'feedback' ? '<b>↺</b>' : ''}<span class="nm">${esc(s.short)}</span>${dot(s)}`, '', `${s.node} (${tlabel()}): ${ST(s).title}`)).join('');
  return h + '<i class="dk-sep" aria-hidden="true"></i>' + item('ledger', 'Ledger', 'end', 'Timeline, cost and calls');
}
function headerCtl() {
  $('#brand').textContent = S.brand;
  document.title = S.brand;
  const n = (b) => (tres(b) || {}).n || 0;  // measurements on the shown track
  $('#filter').innerHTML = D.brains.map((b) => [b, label(b)]).concat([['all', 'Both']]).map(([k, l]) =>
    `<button type="button" data-brain="${esc(k)}" aria-pressed="${k === sel}" title="${k === 'all' ? 'Every brain, side by side, never merged' : `Show ${esc(l)} results only (${n(k)} on ${esc(tlabel())})`}">` +
    `${k === 'all' ? '' : `<i class="bd${n(k) ? ' on' : ''}"></i>`}${esc(l)}${k === 'all' ? '' : `<span class="n">${n(k)}</span>`}</button>`).join('');
  const lv = $('#live');
  lv.setAttribute('aria-pressed', String(live));
  lv.title = live ? `Reloads every ${RELOAD_S} s while you are idle. Click to pause.` : 'Auto-reload is paused. Click to resume.';
  $('#built').innerHTML = `validation v${esc(D.version)}<span class="t">, built <time>${ago(D.built_t)}</time></span>`;
  $('#built').title = `Validation v${D.version}, page built ${D.built}`;
  $('#steps').innerHTML = dock();
}
function renderAll() {
  hideLoop();
  headerCtl();
  $('#cover').innerHTML = cover();
  $('#track').innerHTML = SECS.map(chapter).join('');
  $('#ledger').innerHTML = ledger();
  $('#builders').innerHTML = builders();
  fitMark();
  fitCover();
}
function fitCover() {  // the loop's max height leaves room for the heading and the key as they actually wrap
  const h = $('#cover .cover-head'), k = $('#cover .key');
  if (h) $('#cover').style.setProperty('--head', Math.ceil(h.getBoundingClientRect().height) + 'px');
  if (k) $('#cover').style.setProperty('--keyh', Math.ceil(k.getBoundingClientRect().height) + 10 + 'px');  // + its margins
}
function markOverflow() {  // a list cut by its tile fades out at the bottom; the card holds the rest
  $$('.cl, .lg, .thumbs').forEach((el) => el.classList.toggle('more-fade', el.scrollHeight > el.clientHeight + 2));
}

// ------------------------------------------------------------------ scrolling: cover, then the steps sideways, then the ledger
let mm = null, pinST = null, hmode = false, curPage = -1, raf = 0, jumping = false;
const drawn = new Set();
const pw = () => document.documentElement.clientWidth;
function positions() {
  const P = [0], chs = $$('.ch');
  if (hmode && pinST) chs.forEach((_, i) => P.push(pinST.start + (pinST.end - pinST.start) * (chs.length > 1 ? i / (chs.length - 1) : 0)));
  else chs.forEach((ch) => P.push(ch.getBoundingClientRect().top + scrollY));
  P.push($('#ledger').getBoundingClientRect().top + scrollY, $('#builders').getBoundingClientRect().top + scrollY);
  return P;
}
function pageAt(y) {
  const P = positions(), lg = P.length - 2;  // the ledger, then the builders page
  if (y >= P[lg + 1] - innerHeight * 0.5) return lg + 1;
  if (y >= P[lg] - innerHeight * 0.5) return lg;
  let best = 0;
  for (let i = 0; i < lg; i++) if (Math.abs(P[i] - y) <= Math.abs(P[best] - y)) best = i;
  return best;
}
function snapTo(v) {  // every page is a stop; inside the ledger the scroll is free until the builders page is half in view
  const max = ScrollTrigger.maxScroll(window), y = v * max, P = positions(), lg = P.length - 2;
  if (y > P[lg + 1] - innerHeight * 0.5) return Math.min(1, P[lg + 1] / max);
  if (y > P[lg] + 4) return v;
  let best = P[0];
  for (const q of P.slice(0, lg + 1)) if (Math.abs(q - y) < Math.abs(best - y)) best = q;
  return Math.min(1, best / max);
}
function setupScroll() {
  if (mm) mm.revert();
  if (!GS) { onScroll(); return; }
  mm = gsap.matchMedia();
  mm.add({wide: '(min-width: 960px) and (min-height: 560px)', reduce: '(prefers-reduced-motion: reduce)'}, (ctx) => {
    const {wide, reduce} = ctx.conditions;
    hmode = wide && !reduce;
    document.documentElement.classList.toggle('h-mode', hmode);
    document.documentElement.style.setProperty('--pw', pw() + 'px');
    const track = $('#track'), chs = $$('.ch');
    if (hmode && chs.length > 1) {
      const tween = gsap.to(track, {x: () => -(track.scrollWidth - pw()), ease: 'none'});
      pinST = ScrollTrigger.create({trigger: '#chapters', start: 'top top', end: () => '+=' + (track.scrollWidth - pw()), pin: true, scrub: 0.35,
        animation: tween, invalidateOnRefresh: true});
      // each step's heading drifts a little slower than its tiles, and rests at 0 when the page is centred
      chs.forEach((ch) => gsap.fromTo(ch.querySelector('.t-intro'), {x: 70}, {x: -70, ease: 'none',
        scrollTrigger: {trigger: ch, containerAnimation: tween, start: 'left right', end: 'right left', scrub: true}}));
      ScrollTrigger.create({start: 0, end: 'max', snap: {snapTo, duration: {min: 0.2, max: 0.6}, delay: 0.05, ease: 'power2.inOut'}});
      drawn.clear();
      const sps = $$('.ch .t-num .sp');
      if (sps.length) gsap.set(sps, {clipPath: 'inset(0% 100% 0% 0%)'});
    }
    return () => {
      pinST = null; hmode = false;
      document.documentElement.classList.remove('h-mode');
      const sps = $$('.ch .sp');
      if (sps.length) gsap.set(sps, {clearProps: 'clipPath'});
    };
  });
}
function syncVideos() {  // only the page on screen plays, and nothing plays behind an open card
  const id = PAGES()[curPage], open = $('#sheet').open;
  $$('.ch video[data-auto]').forEach((v) => { if (!open && v.closest('.ch').dataset.sec === id) v.play().catch(() => {}); else v.pause(); });
  $$('#cover video[data-cover]').forEach((v) => { if (!open && id === 'top') v.play().catch(() => {}); else v.pause(); });
}
function setPage(i) {
  curPage = i;
  const pages = PAGES(), id = pages[i];
  $$('#steps [data-go]').forEach((b) => b.setAttribute('aria-current', String(b.dataset.go === id)));
  $('#blink').setAttribute('aria-current', String(id === 'builders'));
  const here = $(`#steps [data-go="${CSS.escape(id)}"]`);
  if (here) here.scrollIntoView({block: 'nearest', inline: 'nearest'});
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= pages.length - 1;
  $('#prev').title = i > 0 ? 'Back to ' + pageName(pages[i - 1]) : '';
  $('#next').title = i < pages.length - 1 ? 'On to ' + pageName(pages[i + 1]) : '';
  syncVideos();
  if (hmode && GS && !drawn.has(id)) {  // a step's trend lines draw once, when it first comes into view
    drawn.add(id);
    const sp = $$(`#ch-${CSS.escape(id)} .t-num .sp`);
    if (sp.length) gsap.to(sp, {clipPath: 'inset(0% 0% 0% 0%)', duration: 0.9, ease: 'power2.out', stagger: 0.1, delay: 0.15});
  }
  const parts = [id !== 'top' ? id : '', cur !== PRIMARY ? 'track=' + cur : '', sel !== 'all' ? 'brain=' + sel : ''].filter(Boolean);
  try { history.replaceState(null, '', parts.length ? '#' + parts.join('&') : location.pathname + location.search); } catch (err) { /* file:// quirks */ }
}
function onScroll() {
  if (lpOn && !lpWant.focus) { lpWant.hover = null; hideLoop(); }  // the panel belongs to the spot it was opened at
  if (raf) return;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    $('#progbar').style.transform = `scaleX(${Math.min(1, scrollY / max)})`;
    const i = pageAt(scrollY);
    if (i !== curPage) setPage(i);
  });
}
addEventListener('scroll', onScroll, {passive: true});
function instantTo(y) {  // land exactly, with the sideways track caught up (no sweep through the pages between)
  window.scrollTo(0, y);
  if (GS) {
    ScrollTrigger.update();
    const tw = pinST && pinST.getTween && pinST.getTween();
    if (tw) tw.progress(1);
  }
}
function pageContent(id) {
  if (id === 'top') return $$('#cover .cover-head, #cover .flow');
  if (id === 'ledger') return $$('#ledger > header, #ledger .lg-grid');
  if (id === 'builders') return $$('#builders .bd-panel');
  return $$(`#ch-${CSS.escape(id)} .bento`);
}
function goTo(target, instant) {
  const pages = PAGES();
  let id = target;
  if (typeof id === 'string' && !pages.includes(id)) id = (secOf(id) || {}).id;
  const i = typeof id === 'number' ? id : pages.indexOf(id);
  if (i < 0 || jumping) return;
  const P = positions(), y = P[Math.max(0, Math.min(P.length - 1, i))], from = curPage < 0 ? pageAt(scrollY) : curPage;
  if (instant || !GS || calm()) { instantTo(y); onScroll(); return; }
  if (Math.abs(i - from) <= 1 && STO) {  // the next or previous page: slide to it
    gsap.to(window, {scrollTo: {y, autoKill: false}, duration: 0.7, ease: 'power2.inOut', overwrite: 'auto'});
    return;
  }
  // further away: a short fade straight to the page, then it settles in from below; no sweep through the pages between
  jumping = true;
  const curtain = $('#curtain');
  gsap.timeline({onComplete: () => { jumping = false; }})
    .to(curtain, {autoAlpha: 1, duration: 0.16, ease: 'power1.in'})
    .add(() => { instantTo(y); onScroll(); const el = pageContent(pages[i]); if (el.length) gsap.fromTo(el, {y: 26}, {y: 0, duration: 0.45, ease: 'power3.out', clearProps: 'transform'}); })
    .to(curtain, {autoAlpha: 0, duration: 0.3, ease: 'power1.out'});
}
function intro() {  // one orchestrated moment: the loop draws itself on first load
  const svg = $('#cover svg');
  if (!svg) return;
  const paths = $$('path.ar', svg);
  paths.forEach((p) => { const L = p.getTotalLength(); gsap.set(p, {strokeDasharray: `${L} ${L}`, strokeDashoffset: L}); });
  gsap.timeline({defaults: {ease: 'power2.out'}})
    .from('#cover .cover-head > *', {y: 12, opacity: 0, duration: 0.5, stagger: 0.08})
    .from($$('.frame, .lp-r, .lpl, .io, .nd, .lead, .tnote-g, .tsw-fo, .fb, .gchip, .arm, .clip, .sk, text.lbl', svg), {opacity: 0, duration: 0.4, stagger: 0.03}, '-=0.25')
    .to(paths, {strokeDashoffset: 0, duration: 0.4, stagger: 0.06, ease: 'none', onComplete: () => gsap.set(paths, {clearProps: 'strokeDasharray,strokeDashoffset'})}, '-=0.3')
    .from($$('[data-flow]', svg), {opacity: 0, duration: 0.4}, '-=0.1');
}
function rebuild() {
  const id = PAGES()[Math.max(0, curPage)];
  renderAll();
  setupScroll();
  curPage = -1;
  if (GS) ScrollTrigger.refresh();
  markOverflow();
  goTo(id, true);
}
// switch the whole page to another data track: instant, from data built in; then, if asked, go to a step
function setTrack(id, go, refocus) {
  if ($('#sheet').open) $('#sheet').close();
  if (id !== cur && trackById(id)) {
    cur = id;
    store.set('track', cur);
    rebuild();
    const b = refocus && $(`.tsw [data-track="${CSS.escape(cur)}"]`);
    if (b) b.focus({preventScroll: true});
  }
  if (go) goTo(go);
}

// ------------------------------------------------------------------ input
document.addEventListener('click', (e) => {
  const t = e.target;
  const br = t.closest('[data-brain]');
  if (br) { sel = br.dataset.brain; store.set('brain', sel); rebuild(); return; }
  const tr = t.closest('[data-track]');
  if (tr) { e.preventDefault(); setTrack(tr.dataset.track, tr.dataset.go, !!tr.closest('.tsw')); return; }
  if (t.closest('#live')) {
    live = !live; store.set('live', live);
    const lv = $('#live');
    lv.setAttribute('aria-pressed', String(live));
    lv.title = live ? `Reloads every ${RELOAD_S} s while you are idle. Click to pause.` : 'Auto-reload is paused. Click to resume.';
    schedule();
    return;
  }
  if (t.closest('#prev')) { goTo(Math.max(0, curPage - 1)); return; }
  if (t.closest('#next')) { goTo(Math.min(PAGES().length - 1, curPage + 1)); return; }
  if (t.closest('#sheet-close')) { $('#sheet').close(); return; }
  if (t.closest('#tl-more')) { store.set('tlall', !store.get('tlall', false)); $('#tl').innerHTML = timeline(); return; }
  const sv = t.closest('video[data-sync]');
  if (sv) { const vs = $$('#sheet video[data-sync]'), play = vs[0].paused; vs.forEach((v) => (play ? v.play().catch(() => {}) : v.pause())); return; }
  const go = t.closest('[data-go]');
  if (go) { e.preventDefault(); if ($('#sheet').open) $('#sheet').close(); goTo(go.dataset.go); return; }
  const sw = t.closest('[data-swap]');
  if (sw) {
    const im = sw.closest('.t-hero') && sw.closest('.t-hero').querySelector('.mf img');
    if (im) im.src = sw.dataset.swap;
    $$('[data-swap]', sw.parentElement).forEach((b) => b.setAttribute('aria-pressed', String(b === sw)));
    return;
  }
  const pk = t.closest('[data-pick]');
  if (pk) {
    const [sid, mid] = pk.dataset.pick.split('|'), sec = secById(sid), ch = $('#ch-' + CSS.escape(sid));
    picks[sid] = mid;
    ch.querySelector('.t-hero').outerHTML = heroTile(sec, mediaFor(sec.stages));
    $$('[data-pick]', ch).forEach((b) => b.setAttribute('aria-pressed', String(b === pk)));
    syncVideos();
    return;
  }
  if (t.closest('a, input, summary, video[controls]')) return;
  const op = t.closest('[data-open]');
  if (op) openSheet(op.dataset.open);
});
document.addEventListener('loadedmetadata', (e) => {
  const v = e.target;
  if (v.tagName === 'VIDEO' && v.videoHeight && v.videoWidth / v.videoHeight > 2) v.classList.add('wide');
}, true);
document.addEventListener('input', (e) => {
  const w = e.target.closest && e.target.closest('.wipe');
  if (w) w.style.setProperty('--p', e.target.value + '%');
});
document.addEventListener('keydown', (e) => {
  if ($('#sheet').open) return;
  if (e.key === 'Escape' && lpOn) { lpWant.hover = lpWant.focus = null; lpUpdate(0); return; }
  const g = e.target.closest && e.target.closest('g[data-go], g[data-open], text[data-open]');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); if (g.dataset.go) goTo(g.dataset.go); else openSheet(g.dataset.open); return; }
  if (/^(INPUT|TEXTAREA|SELECT|VIDEO|BUTTON)$/.test(e.target.tagName) && (e.key === ' ' || e.key === 'Enter')) return;
  if (/^(INPUT|TEXTAREA|SELECT|VIDEO)$/.test(e.target.tagName)) return;
  const i = curPage < 0 ? pageAt(scrollY) : curPage, last = PAGES().length - 1, lg = PAGES().indexOf('ledger');
  if (e.key === 'Home') { e.preventDefault(); goTo(0); return; }
  let dir = {ArrowRight: 1, j: 1, n: 1, ArrowLeft: -1, k: -1, p: -1}[e.key];
  if (!dir && i !== lg) dir = {ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1}[e.key];  // the ledger keeps native vertical keys
  if (!dir && i === lg && (e.key === 'ArrowUp' || e.key === 'PageUp') && scrollY <= positions()[lg] + 2) dir = -1;
  if (!dir) return;
  e.preventDefault();
  goTo(Math.max(0, Math.min(last, i + dir)));
});

// Live: reload every 30 s while idle; keep the page the viewer was on.
let timer = null, lastInput = Date.now();
for (const ev of ['wheel', 'pointerdown', 'keydown', 'touchstart']) addEventListener(ev, () => { lastInput = Date.now(); }, {passive: true});
function schedule() {
  clearTimeout(timer);
  if (!live) return;
  timer = setTimeout(() => {
    const busy = $('#sheet').open || lpOn || Date.now() - lastInput < 10000 || $$('video').some((v) => !v.paused && !v.muted);
    if (busy) { schedule(); return; }
    try {
      const i = pageAt(scrollY);
      sessionStorage.setItem('bot18.pos', JSON.stringify({id: PAGES()[i], dy: scrollY - positions()[i]}));
    } catch (err) { /* storage off */ }
    location.reload();
  }, RELOAD_S * 1000);
}

// ------------------------------------------------------------------ boot
let restored = null;
try { restored = JSON.parse(sessionStorage.getItem('bot18.pos') || 'null'); sessionStorage.removeItem('bot18.pos'); } catch (err) { /* storage off */ }
try { history.scrollRestoration = 'manual'; } catch (err) { /* old browser */ }
renderAll();
setupScroll();
markOverflow();
if (GS) {
  ScrollTrigger.addEventListener('refreshInit', () => { document.documentElement.style.setProperty('--pw', pw() + 'px'); fitMark(); fitCover(); });
  ScrollTrigger.addEventListener('refresh', markOverflow);
} else addEventListener('resize', () => { markOverflow(); fitMark(); fitCover(); });
const land = () => {
  if (restored && PAGES().includes(restored.id)) {
    const i = PAGES().indexOf(restored.id);
    instantTo(positions()[i] + (restored.id === 'ledger' ? restored.dy || 0 : 0));
  } else if (hashPage && (PAGES().includes(hashPage) || secOf(hashPage))) goTo(hashPage, true);
  onScroll();
};
land();
if (GS && !restored && !(hashPage && hashPage !== 'top') && !calm()) intro();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitMark(); fitCover(); if (GS) { ScrollTrigger.refresh(); land(); } markOverflow(); });
schedule();
})();
</script>
</body>
